services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${ERP_APP_IMAGE:-erp-app}
    container_name: erp-app
    ports:
      - "8080:80"
    env_file:
      - ${ERP_ENV_FILE:-.env.docker}
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      CACHE_STORE: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RUN_MIGRATIONS: "true"
      RUN_SEEDERS: "true"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/health/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  redis:
    image: redis:8.10-alpine
    container_name: erp-redis
    user: redis
    env_file:
      - ${ERP_ENV_FILE:-.env.docker}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        test -n "$${REDIS_USERNAME:-}"
        test -n "$${REDIS_PASSWORD:-}"
        umask 077
        printf 'user default off\nuser %s on >%s ~* &* +@all\n' "$${REDIS_USERNAME}" "$${REDIS_PASSWORD}" > /tmp/users.acl
        exec redis-server \
          --aclfile /tmp/users.acl \
          --save "" \
          --appendonly no \
          --maxmemory "$${REDIS_MAXMEMORY:-128mb}" \
          --maxmemory-policy allkeys-lru
    expose:
      - "6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --user \"$$REDIS_USERNAME\" --pass \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    container_name: erp-mysql
    ports:
      - "${MYSQL_PUBLISHED_PORT:-3307}:3306"
    environment:
      MYSQL_DATABASE: maestro_panadero
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_ROOT_HOST: "%"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:5-apache
    container_name: erp-phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_ARBITRARY: 0
      UPLOAD_LIMIT: 128M
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_data:
